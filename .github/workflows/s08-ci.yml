name: S08 Management OS Release Gate

on:
  push:
    branches: [management-os-rebuild]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify source files
        run: test -s index.html && test -s styles.css && test -s app.js
      - name: JavaScript syntax gate
        run: node --check app.js
      - name: S08 fingerprint gate
        run: |
          grep -q "MANAGEMENT OS" index.html
          grep -q "Delegation & Control System" index.html
          grep -q "ijdlppmdjrapisckllfh" app.js
          ! grep -qi "thai senior care v2" index.html app.js styles.css
      - name: Secret safety gate
        run: |
          ! grep -Eqi "SUPABASE_SERVICE_ROLE_KEY|SERVICE_ROLE_KEY|sb_secret_|service_role[[:space:]]*[:=]" index.html app.js styles.css
